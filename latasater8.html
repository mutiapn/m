  <script>
    // =========================================================================

    const QUESTIONS = [
      // BAGIAN I: PILIHAN GANDA (1 - 40)
      {
        id: 1,
        section: 'PG',
        topic: 'Fungsi & Pemetaan',
        question: 'Sebuah mesin penjual minuman otomatis (vending machine) menerima uang kertas dan pilihan tombol minuman dari pembeli, lalu memverifikasi nominal uang serta ketersediaan stok di dalam sistem, hingga mengeluarkan kaleng minuman dingin ke kotak pengambilan. Berdasarkan ilustrasi tersebut, komponen yang berperan sebagai <b>output</b> adalah...',
        options: {
          A: 'Uang kertas yang dimasukkan pembeli',
          B: 'Tombol pilihan minuman yang ditekan',
          C: 'Kaleng minuman dingin yang keluar ke kotak pengambilan',
          D: 'Proses verifikasi nominal uang dan stok'
        },
        answer: ['C'],
        explanation: 'Dalam konsep sistem komputer dan fungsi (Input → Proses → Output):<br>• <b>Input (Masukan):</b> Uang kertas dan pilihan tombol minuman (opsi A dan B).<br>• <b>Proses:</b> Verifikasi nominal uang dan stok (opsi D).<br>• <b>Output (Keluaran):</b> Hasil akhir berupa <b>kaleng minuman dingin yang keluar ke kotak pengambilan</b> (C).'
      },
      {
        id: 2,
        section: 'PG',
        topic: 'Fungsi & Pemetaan',
        question: 'Sebuah fungsi didefinisikan sebagai <code>g(x) = x + 7</code>. Manakah penjelasan yang paling tepat mengenai proses yang terjadi pada fungsi tersebut?',
        options: {
          A: 'Fungsi tersebut mengalikan setiap input (x) dengan 7 untuk menghasilkan output.',
          B: 'Fungsi tersebut menambahkan nilai 7 pada setiap input (x) untuk menghasilkan output.',
          C: 'Fungsi tersebut membagi setiap input (x) dengan 7 untuk menghasilkan output.',
          D: 'Fungsi tersebut mengurangi setiap input (x) sebesar 7 untuk menghasilkan output.'
        },
        answer: ['B'],
        explanation: 'Notasi <code>g(x) = x + 7</code> menggunakan operator penjumlahan (<code>+</code>). Artinya, setiap nilai masukan <code>x</code> akan ditambah dengan <code>7</code> untuk menghasilkan nilai keluaran <code>g(x)</code>.'
      },
      {
        id: 3,
        section: 'PG',
        topic: 'Fungsi & Pemetaan',
        question: 'Perhatikan tabel masukan (input) dan keluaran (output) suatu fungsi berikut ini:',
        extraHtml: `
          <div class="my-3 overflow-hidden rounded-xl border border-slate-200 max-w-xs">
            <table class="w-full text-xs text-center">
              <thead class="bg-slate-100 text-slate-700 font-bold border-b border-slate-200">
                <tr><th class="py-2 px-3 border-r border-slate-200">Input (x)</th><th class="py-2 px-3">Output (y)</th></tr>
              </thead>
              <tbody class="divide-y divide-slate-200 bg-white font-mono">
                <tr><td class="py-1.5 border-r border-slate-200">1</td><td>5</td></tr>
                <tr><td class="py-1.5 border-r border-slate-200">2</td><td>8</td></tr>
                <tr><td class="py-1.5 border-r border-slate-200">3</td><td>11</td></tr>
                <tr><td class="py-1.5 border-r border-slate-200">4</td><td>14</td></tr>
              </tbody>
            </table>
          </div>
          <p class="text-sm text-slate-800">Pola rumus fungsi yang tepat untuk menghasilkan nilai keluaran pada tabel tersebut adalah...</p>
        `,
        options: {
          A: 'y = 2x + 1',
          B: 'y = 3x - 2',
          C: 'y = x² + 1',
          D: 'y = 3x + 2'
        },
        answer: ['D'],
        explanation: 'Perhatikan selisih antar output: 5 → 8 → 11 → 14 selalu bertambah <b>3</b>, sehingga koefisien <code>x</code> adalah <code>3</code> (<code>3x</code>).<br>Uji dengan <code>x = 1</code> pada rumus <code>y = 3x + 2</code>:<br>• x = 1 → y = 3(1) + 2 = <b>5</b> (Cocok)<br>• x = 2 → y = 3(2) + 2 = <b>8</b> (Cocok)<br>• x = 3 → y = 3(3) + 2 = <b>11</b> (Cocok)<br>• x = 4 → y = 3(4) + 2 = <b>14</b> (Cocok)'
      },
      {
        id: 4,
        section: 'PG',
        topic: 'Fungsi & Pemetaan',
        question: 'Suatu fungsi <code>h(x)</code> dirumuskan dengan <code>h(x) = 4x - 3</code>. Apabila nilai masukan (x) yang diberikan adalah 6, maka nilai keluaran <code>h(6)</code> adalah...',
        options: {
          A: '15',
          B: '21',
          C: '24',
          D: '27'
        },
        answer: ['B'],
        explanation: 'Substitusikan nilai <code>x = 6</code> ke dalam rumus fungsi:<br><code>h(6) = 4(6) - 3</code><br><code>h(6) = 24 - 3 = 21</code>.'
      },
      {
        id: 5,
        section: 'PG',
        topic: 'Fungsi & Pemetaan',
        question: 'Sebuah layanan cetak foto digital menetapkan biaya jasa edit tetap sebesar Rp15.000 per pesanan dan biaya cetak Rp1.500 untuk setiap lembar foto. Jika seorang pelanggan mencetak <code>n</code> lembar foto, model fungsi total biaya <code>B(n)</code> yang harus dibayar adalah...',
        options: {
          A: 'B(n) = 15.000n + 1.500',
          B: 'B(n) = 1.500n + 15.000',
          C: 'B(n) = 16.500n',
          D: 'B(n) = 1.500(n + 15.000)'
        },
        answer: ['B'],
        explanation: '• Biaya variabel (bergantung jumlah lembar <code>n</code>) = <code>1.500 × n = 1.500n</code>.<br>• Biaya tetap per pesanan (konstanta) = <code>15.000</code>.<br>Jadi total biaya adalah <code>B(n) = 1.500n + 15.000</code>.'
      },
      {
        id: 6,
        section: 'PG',
        topic: 'Fungsi & Pemetaan',
        question: 'Sebuah sistem sensor menggunakan fungsi <code>f(x) = x² + 3</code> untuk menghitung indeks tekanan. Jika nilai masukan awal <code>x = 2</code> berubah menjadi <code>x = 6</code>, selisih peningkatan nilai output yang dihasilkan sistem adalah...',
        options: {
          A: '12',
          B: '24',
          C: '32',
          D: '39'
        },
        answer: ['C'],
        explanation: '1. Hitung output awal saat <code>x = 2</code>:<br><code>f(2) = 2² + 3 = 4 + 3 = 7</code>.<br>2. Hitung output akhir saat <code>x = 6</code>:<br><code>f(6) = 6² + 3 = 36 + 3 = 39</code>.<br>3. Selisih peningkatan = <code>39 - 7 = 32</code>.'
      },
      {
        id: 7,
        section: 'PG',
        topic: 'Fungsi & Pemetaan',
        question: 'Sebuah mesin penyandi teks bekerja dengan aturan fungsi: Setiap huruf konsonan digeser maju 1 huruf dalam urutan abjad (misal: B → C, K → L), sedangkan huruf vokal tetap. Ketika kata <b>"BUKU"</b> dimasukkan, mesin menghasilkan keluaran <b>"C V L U"</b>. Di manakah letak kesalahan proses fungsi pada mesin tersebut?',
        options: {
          A: "Mesin gagal mengubah huruf konsonan 'B' menjadi 'C'.",
          B: "Mesin salah mengubah huruf vokal 'U' pertama menjadi 'V'.",
          C: "Mesin tidak mengubah huruf konsonan 'K' menjadi 'L'.",
          D: 'Mesin seharusnya mengubah semua huruf vokal dan konsonan.'
        },
        answer: ['B'],
        explanation: 'Mari telusuri setiap huruf pada kata <b>B - U - K - U</b>:<br>• <b>B</b> (konsonan) → digeser maju 1 huruf menjadi <b>C</b> (Benar).<br>• <b>U</b> (vokal) → seharusnya tetap <b>U</b>, tetapi mesin mengubahnya menjadi <b>V</b> (<b>Salah</b>).<br>• <b>K</b> (konsonan) → digeser maju 1 huruf menjadi <b>L</b> (Benar).<br>• <b>U</b> (vokal) → tetap <b>U</b> (Benar).<br>Seharusnya keluaran yang benar adalah "C U L U".'
      },
      {
        id: 8,
        section: 'PG',
        topic: 'Fungsi & Pemetaan',
        question: 'Sebuah aplikasi penyewaan sepeda listrik mengenakan tarif awal sebesar Rp10.000 untuk 1 jam pertama, dan biaya tambahan Rp4.000 untuk setiap jam berikutnya. Jika <code>t</code> menyatakan lama pemakaian dalam jam (untuk <code>t ≥ 1</code>) dan <code>f(t)</code> menyatakan total biaya sewa, model fungsi yang paling tepat adalah...',
        options: {
          A: 'f(t) = 10.000t + 4.000',
          B: 'f(t) = 4.000t + 6.000',
          C: 'f(t) = 4.000t + 10.000',
          D: 'f(t) = 10.000(t - 1) + 4.000'
        },
        answer: ['B'],
        explanation: 'Untuk <code>t</code> jam pemakaian (<code>t ≥ 1</code>):<br>• 1 jam pertama dikenakan Rp10.000.<br>• Sisa waktu berikutnya adalah <code>(t - 1)</code> jam dengan tarif Rp4.000/jam.<br>Model fungsi: <code>f(t) = 10.000 + 4.000(t - 1)</code><br>Sederhanakan: <code>f(t) = 10.000 + 4.000t - 4.000 = 4.000t + 6.000</code>.<br><i>Cek:</i> Jika <code>t = 1</code>, <code>f(1) = 4.000(1) + 6.000 = 10.000</code> (Sesuai!).'
      },
      {
        id: 9,
        section: 'PG',
        topic: 'Himpunan',
        question: 'Suatu kumpulan objek disebut himpunan apabila anggotanya dapat didefinisikan secara jelas dan terukur. Perhatikan kelompok objek berikut:<br>(1) Kelompok siswa kelas VIII yang memiliki tinggi badan di atas 160 cm<br>(2) Kelompok aplikasi smartphone yang tampilannya menarik<br>(3) Kelompok bilangan prima kurang dari 20<br>(4) Kelompok makanan tradisional yang rasanya lezat<br>Manakah yang merupakan himpunan yang tepat?',
        options: {
          A: '(1) dan (2)',
          B: '(1) dan (3)',
          C: '(2) dan (4)',
          D: '(3) dan (4)'
        },
        answer: ['B'],
        explanation: '• Pernyataan (1) terukur jelas (angka > 160 cm) → <b>Himpunan</b>.<br>• Pernyataan (2) bersifat relatif/subjektif ("menarik") → <b>Bukan himpunan</b>.<br>• Pernyataan (3) terdefinisi jelas {2, 3, 5, 7, 11, 13, 17, 19} → <b>Himpunan</b>.<br>• Pernyataan (4) bersifat relatif/subjektif ("lezat") → <b>Bukan himpunan</b>.'
      },
      {
        id: 10,
        section: 'PG',
        topic: 'Himpunan',
        question: 'Diketahui himpunan <code>K = {2, 4, 6, 8}</code> dan himpunan <code>L = {1, 3, 5, 7}</code>. Pernyataan yang paling tepat mengenai hubungan antara himpunan K dan himpunan L adalah...',
        options: {
          A: 'Himpunan K dan L merupakan himpunan saling lepas karena tidak memiliki satu pun anggota yang sama.',
          B: 'Himpunan K merupakan himpunan bagian dari L karena sama-sama bilangan bulat.',
          C: 'Himpunan K dan L adalah himpunan yang sama karena jumlah anggotanya empat.',
          D: 'Himpunan L memuat seluruh anggota himpunan K.'

        btn.className = 'flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold transition-all shadow-sm border cursor-pointer active:scale-95 bg-amber-50 text-amber-800 border-amber-200 hover:bg-amber-100';
        label.textContent = 'Mode Belajar';
        icon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>`;
        bannerText.innerHTML = '<strong>Mode Belajar Aktif:</strong> Semua jawaban disembunyikan. Klik opsi jawaban untuk berlatih, lalu tekan <em>Lihat Pembahasan</em> pada tiap soal.';
      }

      renderQuestions();
    }

    function toggleSingleReveal(id) {
      if (state.revealedIds.has(id)) {
        state.revealedIds.delete(id);
      } else {
        state.revealedIds.add(id);
      }
      renderQuestions();
    }

    function handleOptionClick(qId, optionKey, section) {
      // Allow interactive selection in Study Mode
      if (state.showAllAnswers) return;

      if (!state.userSelections[qId]) {
        state.userSelections[qId] = new Set();
      }

      const currentSet = state.userSelections[qId];

      if (section === 'PG') {
        if (currentSet.has(optionKey)) {
          currentSet.clear();
        } else {
          currentSet.clear();
          currentSet.add(optionKey);
        }
      } else if (section === 'PGK') {
        if (currentSet.has(optionKey)) {
          currentSet.delete(optionKey);
        } else {
          if (currentSet.size >= 2) {
            // Remove oldest selection so max 2 can be picked
            const firstItem = currentSet.values().next().value;
            currentSet.delete(firstItem);
          }
          currentSet.add(optionKey);
        }
      }

      renderQuestions();
    }

    // Scroll to top button visibility
    window.addEventListener('scroll', () => {
      const btn = document.getElementById('scrollTopBtn');
      if (window.scrollY > 400) {
        btn.classList.remove('opacity-0', 'pointer-events-none');
        btn.classList.add('opacity-100');
      } else {
        btn.classList.add('opacity-0', 'pointer-events-none');
        btn.classList.remove('opacity-100');
      }
    });

    // Initial render
    window.onload = function() {
      renderQuestions();
    };
  </script>
</body>
</html>
